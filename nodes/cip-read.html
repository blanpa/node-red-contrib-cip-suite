<script type="text/javascript">
  RED.nodes.registerType("cip-read", {
    category: "CIP Suite",
    color: "#999999",
    defaults: {
      name: { value: "" },
      endpoint: { value: "", type: "cip-endpoint", required: true },
      tagName: { value: "" },
      dataType: { value: "auto" },
      pollInterval: { value: 0 }
    },
    inputs: 1,
    outputs: 1,
    icon: "cip.svg",
    paletteLabel: "cip read",
    label: function () {
      return this.name || this.tagName || "cip read";
    },
    oneditprepare: function () {
      // Guarded, see the note on setupTagBrowse in cip-endpoint.html.
      if (window.cipSuiteEditor) {
        window.cipSuiteEditor.setupTagBrowse();
      } else {
        console.warn("cip-suite: tag browse unavailable, cip-endpoint's editor script did not load");
      }
    }
  });
</script>

<script type="text/html" data-template-name="cip-read">

  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-server"></i> Endpoint</label>
    <input type="text" id="node-input-endpoint" />
  </div>
  <div class="form-row">
    <label for="node-input-tagName"><i class="fa fa-bookmark"></i> Tag Name</label>
    <div style="display:flex; gap:4px;">
      <input type="text" id="node-input-tagName" placeholder="Program:MainProgram.MyTag" style="flex:1" />
      <button type="button" id="node-input-browse-btn" class="red-ui-button" title="Browse tags from PLC">
        <i class="fa fa-search"></i>
      </button>
    </div>
  </div>
  <div class="form-row" id="node-input-taglist-row" style="display:none;">
    <label><i class="fa fa-list"></i> Tags</label>

  </div>
  <div class="form-row">
    <label for="node-input-dataType"><i class="fa fa-database"></i> Data Type</label>
    <select id="node-input-dataType">
      <option value="auto">Auto-detect</option>
      <option value="BOOL">BOOL</option>
      <option value="INT">INT (16-bit)</option>
      <option value="DINT">DINT (32-bit)</option>
      <option value="REAL">REAL (float)</option>
      <option value="STRING">STRING</option>
      <option value="STRUCT">STRUCT (UDT)</option>
      <option value="ARRAY">ARRAY</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> Poll (ms)</label>
    <input type="number" id="node-input-pollInterval" placeholder="0 = trigger only" />
  </div>
</script>

<script type="text/html" data-help-name="cip-read">
  <p>Reads a tag value from an Allen-Bradley PLC via EtherNet/IP (CIP).</p>
  <h3>Inputs</h3>
  <p>An incoming message triggers a read. Set <code>msg.tagName</code> to override the configured tag.</p>
  <p>For batch reads, set <code>msg.tags</code> to an array of tag name strings. Plain tags are read
  together in one operation; arrays and UDTs are read individually, since they need their own
  element count or structure decoding.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">*</span></dt>
    <dd>The tag value read from the PLC. For batch reads, an array of
    <code>{ tagName, value, type }</code> objects, one per requested tag, each carrying an
    <code>error</code> string instead of a value if that tag could not be read.</dd>
    <dt>tagName <span class="property-type">string</span></dt>
    <dd>The name of the tag that was read.</dd>
    <dt>dataType <span class="property-type">string</span></dt>
    <dd>The CIP data type of the tag.</dd>
    <dt>timestamp <span class="property-type">number</span></dt>
    <dd>Unix timestamp (ms) of the read.</dd>
  </dl>
  <h3>Details</h3>
  <p>Set a poll interval (in milliseconds) for periodic reads, or leave at 0 for trigger-only mode.
  Backpressure is applied: if a read is already in-flight, subsequent poll ticks are skipped.</p>
  <p><b>Data Type</b> controls how the tag value is decoded:
  <ul>
    <li><b>Auto-detect</b> — scalars as native values; arrays are read in full and UDT/STRUCT tags are expanded to objects, when the PLC tag list is available.</li>
    <li><b>STRUCT</b> — force UDT/structure decoding (requires tag list from the endpoint connection). An array of UDTs yields one object per element.</li>
    <li><b>ARRAY</b> — read the full array. Override the length with <code>msg.arraySize</code>.</li>
  </ul>
  </p>
  <p><b>Array lengths</b> come from the UDT template for a member array such as
  <code>MyStruct.Member</code>, and otherwise from the controller's Symbol Object (array
  dimensions) in a single request — the tag list does not carry the length of a
  controller- or program-scoped array tag. If a controller does not answer that
  attribute, the length is found by a bisecting index probe. The result is cached until
  the connection is re-established, so polling an array costs one request per poll.</p>
  <p>Click the <i class="fa fa-search"></i> button next to the tag name field to browse available tags
  from the connected PLC. The endpoint must be deployed and connected first.</p>
  <h3>Tag Addressing</h3>
  <ul>
    <li><b>Bit-level access:</b> Use dot notation to read individual bits, e.g. <code>MyDint.5</code> reads bit 5 of a DINT tag.</li>
    <li><b>Array element:</b> Use bracket notation, e.g. <code>MyArray[3]</code> reads element 3.</li>
    <li><b>Array range:</b> Use range notation, e.g. <code>MyArray[0..9]</code> or <code>MyStruct.Member[0..101]</code> reads elements 0 through N.</li>
    <li><b>UDT members:</b> Access members with dot notation, e.g. <code>MyUDT.MemberName</code>.</li>
    <li><b>Whole array:</b> Give the tag on its own, e.g. <code>MyArray</code> or <code>MyStruct.Member</code>, to read every element. An array of UDTs yields one object per element.</li>
    <li><b>Program-scoped:</b> Use <code>Program:MainProgram.TagName</code> syntax.</li>
  </ul>
  <p>Tag paths are matched case-insensitively, the way Logix treats them:
  <code>mystruct.member</code> and <code>MyStruct.Member</code> address the same tag and
  both decode into an object.</p>
  <h3>Batch Mode</h3>
  <p>Send <code>msg.tags</code> as an array of tag names to read several tags at once.
  <code>msg.payload</code> is an array of <code>{ tagName, value, type }</code> objects in the
  order requested.</p>

  <h3>Dynamic control</h3>
  <p>The PLC connection can be selected, re-pointed and controlled at runtime with
  <code>msg.endpoint</code> and <code>msg.action</code> when the endpoint has the
  <b>Dynamic</b> option enabled. See the <code>cip-endpoint</code> help for the
  full reference.</p>
</script>
