<script type="text/javascript">
  RED.nodes.registerType("cip-read", {
    category: "CIP Suite",
    color: "#999999",
    defaults: {
      name: { value: "" },
      endpoint: { value: "", type: "cip-endpoint", required: true },
      mode: { value: "single" },
      tagName: { value: "" },
      tagNameType: { value: "str" },
      dataType: { value: "auto" },
      dataTypeType: { value: "dt" },
      arraySize: { value: "" },
      arraySizeType: { value: "auto" },
      tagList: { value: [] },
      tagsProp: { value: "tags" },
      tagsPropType: { value: "msg" },
      pollInterval: { value: 0 },
      pollIntervalType: { value: "none" }
    },
    inputs: 1,
    outputs: 1,
    icon: "cip.svg",
    paletteLabel: "cip read",
    label: function () {
      if (this.name) {
        return this.name;
      }
      if (this.mode === "multiple") {
        var count = (this.tagList || []).length;
        return count + (count === 1 ? " tag" : " tags");
      }
      if (this.mode === "multiple-msg") {
        return "tags from msg." + (this.tagsProp || "tags");
      }
      if (this.mode === "single" && this.tagNameType === "msg") {
        return "msg." + (this.tagName || "tagName");
      }
      return this.tagName || "cip read";
    },
    oneditprepare: function () {
      var node = this;
      // Nodes saved before modes existed have no mode. Node-RED does not fill in defaults
      // for a property the saved node lacks, so undefined is how they are told apart.
      var legacy = node.mode === undefined || node.mode === "";

      var dataTypes = [
        { value: "auto", label: "Auto-detect" },
        { value: "BOOL", label: "BOOL" },
        { value: "INT", label: "INT (16-bit)" },
        { value: "DINT", label: "DINT (32-bit)" },
        { value: "REAL", label: "REAL (float)" },
        { value: "STRING", label: "STRING" },
        { value: "STRUCT", label: "STRUCT (UDT)" },
        { value: "ARRAY", label: "ARRAY" }
      ];

      var $mode = $("#node-input-mode");
      var $tag = $("#node-input-tagName");
      var $dataType = $("#node-input-dataType");
      var $arraySize = $("#node-input-arraySize");
      var $poll = $("#node-input-pollInterval");
      var $tagsProp = $("#node-input-tagsProp");

      /** A msg typed input starts on a useful property name instead of empty. */
      function defaultOnMsg($input, property) {
        $input.on("typedinputtypechange", function () {
          if ($input.typedInput("type") === "msg" && !$input.typedInput("value")) {
            $input.typedInput("value", property);
          }
        });
      }

      $tag.typedInput({ types: ["str", "msg", "env"], typeField: "#node-input-tagNameType", default: "str" });
      $tag.typedInput("width", "100%");
      defaultOnMsg($tag, "tagName");

      $dataType.typedInput({
        types: [{ value: "dt", label: "Data type", options: dataTypes }, "msg", "env"],
        typeField: "#node-input-dataTypeType",
        default: "dt"
      });
      $dataType.typedInput("width", "100%");
      defaultOnMsg($dataType, "dataType");

      $arraySize.typedInput({
        types: [{ value: "auto", label: "Auto", hasValue: false }, "num", "msg", "env"],
        typeField: "#node-input-arraySizeType",
        default: "auto"
      });
      $arraySize.typedInput("width", "100%");
      defaultOnMsg($arraySize, "arraySize");

      $poll.typedInput({
        types: [{ value: "none", label: "None", hasValue: false }, "num", "env"],
        typeField: "#node-input-pollIntervalType",
        default: "none"
      });
      $poll.typedInput("width", "100%");

      $tagsProp.typedInput({ types: ["msg"], typeField: "#node-input-tagsPropType", default: "msg" });
      $tagsProp.typedInput("width", "100%");

      if (legacy) {
        // Keep what the node already has. A blank tag was filled from the message, so it stays
        // that way. Array size was only ever a hidden msg property and has nothing to carry.
        $mode.val("single");
        if (node.tagName) {
          $tag.typedInput("type", "str");
          $tag.typedInput("value", node.tagName);
        } else {
          $tag.typedInput("type", "msg");
          $tag.typedInput("value", "tagName");
        }
        $dataType.typedInput("type", "dt");
        $dataType.typedInput("value", node.dataType || "auto");
        $arraySize.typedInput("type", "auto");
        $tagsProp.typedInput("type", "msg");
        $tagsProp.typedInput("value", "tags");
        var interval = parseInt(node.pollInterval, 10);
        if (interval > 0) {
          $poll.typedInput("type", "num");
          $poll.typedInput("value", interval);
        } else {
          $poll.typedInput("type", "none");
        }
      }

      // Guarded, see the note on setupTagBrowse in cip-endpoint.html. It also hands back what
      // the per-row Browse buttons below need.
      var browser = null;
      if (window.cipSuiteEditor) {
        browser = window.cipSuiteEditor.setupTagBrowse();
      } else {
        console.warn("cip-suite: tag browse unavailable, cip-endpoint's editor script did not load");
      }

      // Multiple: one row per tag
      var $list = $("#node-input-tagList-container");
      $list.css("min-height", "150px").editableList({
        sortable: true,
        removable: true,
        addButton: "add tag",
        addItem: function (row, index, data) {
          data = data || {};
          var line = $("<div/>", { style: "display:flex; gap:4px; align-items:center;" }).appendTo(row);
          var tagBox = $("<div/>", { style: "flex:1; min-width:0;" }).appendTo(line);
          var rowTag = $("<input/>", { type: "text", class: "cip-row-tag" }).appendTo(tagBox);
          var rowBrowse = $("<button/>", {
            type: "button",
            class: "red-ui-button cip-row-browse",
            title: "Browse tags from PLC",
            style: "margin:0;"
          })
            .append('<i class="fa fa-search"></i>')
            .appendTo(line);
          var rowType = $("<select/>", { class: "cip-row-datatype", style: "width:110px; margin:0;" }).appendTo(line);
          [["auto", "Auto"], ["ARRAY", "ARRAY"], ["STRUCT", "STRUCT"]].forEach(function (o) {
            rowType.append($("<option/>").val(o[0]).text(o[1]));
          });
          var rowSize = $("<input/>", {
            type: "number",
            min: 1,
            class: "cip-row-arraysize",
            placeholder: "size",
            style: "width:70px; margin:0;"
          }).appendTo(line);

          rowTag.typedInput({ types: ["str", "env"], default: data.tagNameType || "str" });
          rowTag.typedInput("width", "100%");
          rowTag.typedInput("type", data.tagNameType || "str");
          rowTag.typedInput("value", data.tagName || "");
          rowType.val(data.dataType || "auto");
          rowSize.val(data.arraySize === undefined || data.arraySize === null ? "" : data.arraySize);

          rowBrowse.on("click", function () {
            if (!browser) {
              RED.notify("Tag browse is unavailable: the cip-endpoint editor script did not load.", "warning");
              return;
            }
            browser.browse(rowBrowse, function (name) {
              rowTag.typedInput("type", "str");
              rowTag.typedInput("value", name);
            });
          });

          function showSize() {
            rowSize.toggle(rowType.val() === "ARRAY");
          }
          rowType.on("change", showSize);
          showSize();
        }
      });
      $list.editableList("addItems", node.tagList || []);

      /** True when a message supplies a value, so there is nothing to read on a timer. */
      function isDynamic() {
        var mode = $mode.val();
        if (mode === "multiple-msg") {
          return true;
        }
        return (
          mode === "single" &&
          ($tag.typedInput("type") === "msg" ||
            $dataType.typedInput("type") === "msg" ||
            $arraySize.typedInput("type") === "msg")
        );
      }
      node._isDynamic = isDynamic;

      function refresh() {
        var mode = $mode.val();
        $(".cip-read-single").toggle(mode === "single");
        $(".cip-read-multiple").toggle(mode === "multiple");
        $(".cip-read-msg").toggle(mode === "multiple-msg");

        // Array size only means something for ARRAY. A dynamic data type could be ARRAY.
        var dataTypeKind = $dataType.typedInput("type");
        var arrayPossible = dataTypeKind !== "dt" || $dataType.typedInput("value") === "ARRAY";
        $("#cip-read-arraysize-row").toggle(mode === "single" && arrayPossible);

        $("#cip-read-poll-row").toggle(!isDynamic());
      }

      $mode.on("change", refresh);
      [$tag, $dataType, $arraySize].forEach(function ($input) {
        $input.on("typedinputtypechange change", refresh);
      });
      refresh();
    },
    oneditsave: function () {
      var node = this;

      var rows = [];
      $("#node-input-tagList-container")
        .editableList("items")
        .each(function () {
          var row = $(this);
          var tagInput = row.find(".cip-row-tag");
          var dataType = row.find(".cip-row-datatype").val();
          rows.push({
            tagName: tagInput.typedInput("value"),
            tagNameType: tagInput.typedInput("type"),
            dataType: dataType,
            arraySize: dataType === "ARRAY" ? row.find(".cip-row-arraysize").val() : ""
          });
        });
      node.tagList = rows;

      // The Poll field is hidden when a message supplies a value, so save it as None.
      if (node._isDynamic && node._isDynamic()) {
        $("#node-input-pollInterval").typedInput("type", "none");
      }
    }
  });
</script>

<script type="text/html" data-template-name="cip-read">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-server"></i> Endpoint</label>
    <input type="text" id="node-input-endpoint" />
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-list-alt"></i> Mode</label>
    <select id="node-input-mode" style="width:70%">
      <option value="single">Single</option>
      <option value="multiple">Multiple</option>
      <option value="multiple-msg">Multiple from msg</option>
    </select>
  </div>

  <div class="cip-read-single">
    <div class="form-row">
      <label for="node-input-tagName"><i class="fa fa-bookmark"></i> Tag Name</label>
      <div class="cip-read-field cip-read-field-browse">
        <div class="cip-read-field-typed">
          <input type="text" id="node-input-tagName" placeholder="Program:MainProgram.MyTag" />
          <input type="hidden" id="node-input-tagNameType" />
        </div>
        <button type="button" id="node-input-browse-btn" class="red-ui-button" title="Browse tags from PLC">
          <i class="fa fa-search"></i>
        </button>
      </div>
    </div>
    <div class="form-row">
      <label for="node-input-dataType"><i class="fa fa-database"></i> Data Type</label>
      <div class="cip-read-field">
        <input type="text" id="node-input-dataType" />
        <input type="hidden" id="node-input-dataTypeType" />
      </div>
    </div>
    <div class="form-row" id="cip-read-arraysize-row">
      <label for="node-input-arraySize"><i class="fa fa-th"></i> Array size</label>
      <div class="cip-read-field">
        <input type="text" id="node-input-arraySize" />
        <input type="hidden" id="node-input-arraySizeType" />
      </div>
      <div class="form-tips cip-read-tip">Optional. Only used when the data type is ARRAY. Auto finds the length.</div>
    </div>
  </div>

  <div class="cip-read-multiple">
    <div class="form-row" style="margin-bottom:0;">
      <label><i class="fa fa-list"></i> Tags</label>
    </div>
    <div class="form-row">
      <ol id="node-input-tagList-container"></ol>
      <div class="form-tips cip-read-tip cip-read-tip-wide">One result per row, in this order. Size is only used for ARRAY.</div>
    </div>
  </div>

  <div class="cip-read-msg">
    <div class="form-row">
      <label for="node-input-tagsProp"><i class="fa fa-bookmark"></i> Tags</label>
      <div class="cip-read-field">
        <input type="text" id="node-input-tagsProp" />
        <input type="hidden" id="node-input-tagsPropType" />
      </div>
      <div class="form-tips cip-read-tip">An array of tag names or { name, dataType, arraySize } objects, or a comma separated string. See Batch Mode in the help.</div>
    </div>
  </div>

  <div class="form-row" id="cip-read-poll-row">
    <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> Poll (ms)</label>
    <div class="cip-read-field">
      <input type="text" id="node-input-pollInterval" />
      <input type="hidden" id="node-input-pollIntervalType" />
    </div>
  </div>
</script>

<style>
  /* Stock fields are 70% wide after a 100px label. Match that so every control ends at the
     same edge at any tray width. A typed input sizes itself from its element when it is built
     and comes out narrower than its wrapper, so its container is pinned to the wrapper. */
  .cip-read-field {
    display: inline-block;
    width: 70%;
    vertical-align: middle;
  }
  .cip-read-field .red-ui-typedInput-container,
  #node-input-tagList-container .red-ui-typedInput-container {
    width: 100% !important;
  }
  /* With a Browse button the typed input and the button share the 70%. */
  .cip-read-field-browse {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .cip-read-field-typed {
    flex: 1;
    min-width: 0;
  }
  /* A tip wraps inside its row. contain stops its text from setting the minimum width of the
     edit tray, and overflow-wrap breaks a long unbroken word instead of overflowing. */
  #dialog-form .form-tips.cip-read-tip {
    margin: 4px 0 0 104px;
    contain: inline-size;
    overflow-wrap: anywhere;
  }
  #dialog-form .form-tips.cip-read-tip-wide {
    margin-left: 0;
  }
</style>

<script type="text/html" data-help-name="cip-read">
  <p>Reads a tag value from an Allen-Bradley PLC via EtherNet/IP (CIP).</p>
  <h3>Inputs</h3>
  <p>An incoming message triggers a read. What is read depends on <b>Mode</b>. Each value comes from the
  place its field names, and a message property is only used when a field is set to <code>msg</code>, so
  nothing in the message overrides what the editor shows.</p>
  <dl class="message-properties">
    <dt>Single</dt>
    <dd>One tag. <b>Tag Name</b> is a string, a message property or an environment variable.
    <b>Data Type</b> is one of the options, a message property or an environment variable. <b>Array size</b>
    is Auto, a number, a message property or an environment variable, and only applies when the data type
    is ARRAY. A message property that is not set means Auto.</dd>
    <dt>Multiple</dt>
    <dd>A list of tags to read together, in the order shown. Each row has a tag (a string or an
    environment variable), a data type (Auto, ARRAY or STRUCT) and, for ARRAY, a size. The message does not
    change the list.</dd>
    <dt>Multiple from msg</dt>
    <dd>Reads the tags from a message property, <code>msg.tags</code> by default. See Multiple from msg below.</dd>
  </dl>
  <p>Plain tags are read together in one operation; arrays and UDTs are read individually, since they
  need their own element count or structure decoding.</p>
  <p><b>A node saved before modes existed</b> behaves as it always did, so <code>msg.tagName</code>,
  <code>msg.tags</code>, <code>msg.dataType</code> and <code>msg.arraySize</code> still override the node.
  Opening it in the editor shows it in Single mode with what it already has: its Data Type is kept, a
  filled Tag Name becomes a string, an empty one reads <code>msg.tagName</code>, and a saved poll interval
  is kept. Saving it turns the rules above on. After that the node logs a warning, once per deploy, if a
  message carries <code>msg.tags</code> or <code>msg.arraySize</code> that it is not set to read.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">*</span></dt>
    <dd>The tag value read from the PLC. For batch reads, an array of
    <code>{ tagName, value, type }</code> objects, one per requested tag, each carrying an
    <code>error</code> string instead of a value if that tag could not be read.</dd>
    <dt>tagName <span class="property-type">string</span></dt>
    <dd>The name of the tag that was read.</dd>
    <dt>dataType <span class="property-type">string</span></dt>
    <dd>The CIP data type of the tag.</dd>
    <dt>timestamp <span class="property-type">number</span></dt>
    <dd>Unix timestamp (ms) of the read.</dd>
  </dl>
  <h3>Details</h3>
  <p><b>Poll</b> can be None (read when a message arrives), a number of milliseconds, or an environment
  variable. A poll tick has no message, so Poll is hidden, and saved as None, whenever a message
  supplies a value: Tag Name, Data Type or Array size set to <code>msg</code>, or Multiple from msg mode.
  An interval that is not a positive whole number is reported by name and the node does not poll.
  Backpressure is applied: if a read is already in-flight, subsequent poll ticks are skipped.</p>
  <p><b>Data Type</b> controls how the tag value is decoded:
  <ul>
    <li><b>Auto-detect</b> — scalars as native values; arrays are read in full and UDT/STRUCT tags are expanded to objects, when the PLC tag list is available.</li>
    <li><b>STRUCT</b> — force UDT/structure decoding (requires tag list from the endpoint connection). An array of UDTs yields one object per element.</li>
    <li><b>ARRAY</b> — read the full array. Set the length with <b>Array size</b>.</li>
  </ul>
  </p>
  <p><b>Values:</b> BOOL is a boolean. SINT, USINT, INT, UINT, DINT, UDINT, REAL, LREAL, BYTE and WORD are numbers.
  LINT, ULINT and LWORD are BigInt, since they do not fit a JavaScript number. A Micro800 reports its BYTE, WORD, DWORD and
  LWORD variables as USINT, UINT, UDINT and ULINT.</p>
  <p><b>Errors:</b> a read the controller refuses raises an error that a Catch node receives, with the CIP status as text and code,
  e.g. <code>Read failed: Path destination unknown (CIP 0x05)</code>. No message is sent.</p>
  <p><b>Array lengths</b> come from the UDT template for a member array such as
  <code>MyStruct.Member</code>, and otherwise from the controller's Symbol Object (array
  dimensions) in a single request — the tag list does not carry the length of a
  controller- or program-scoped array tag. If a controller does not answer that
  attribute, the length is found by a bisecting index probe. The result is cached until
  the connection is re-established, so polling an array costs one request per poll.</p>
  <p>Click the <i class="fa fa-search"></i> button next to the tag name field, or on a row of the list, to
  browse available tags from the connected PLC. The endpoint must be deployed and connected first.</p>
  <h3>Tag Addressing</h3>
  <ul>
    <li><b>Bit-level access:</b> Use dot notation to read individual bits, e.g. <code>MyDint.5</code> reads bit 5 of a DINT tag.</li>
    <li><b>Array element:</b> Use bracket notation, e.g. <code>MyArray[3]</code> reads element 3.</li>
    <li><b>Array range:</b> Use range notation, e.g. <code>MyArray[0..9]</code> or <code>MyStruct.Member[0..101]</code> reads elements 0 through N.</li>
    <li><b>UDT members:</b> Access members with dot notation, e.g. <code>MyUDT.MemberName</code>.</li>
    <li><b>Whole array:</b> Give the tag on its own, e.g. <code>MyArray</code> or <code>MyStruct.Member</code>, to read every element. An array of UDTs yields one object per element.
      This needs the PLC tag list, which ControlLogix and CompactLogix provide. Without one (a Micro800) the node cannot tell that a bare name is an array
      and returns element 0 only. There, read a range such as <code>MyArray[0..9]</code>, or set Data Type to <i>ARRAY</i> (the length is found automatically,
      or set <b>Array size</b>). The write and subscribe nodes always treat a bare name as element 0, see their help.</li>
    <li><b>Strings:</b> Read the STRING tag itself, e.g. <code>Line1.LotName</code>, to get the
    text. Built-in and custom-length strings (STRING20 and so on) both return text.
    <code>.LEN</code> and <code>.DATA</code> are the tag's length and character array, so you
    rarely need them.</li>
    <li><b>Program-scoped:</b> Use <code>Program:MainProgram.TagName</code> syntax.</li>
  </ul>
  <p>Tag paths are matched case-insensitively, the way Logix treats them:
  <code>mystruct.member</code> and <code>MyStruct.Member</code> address the same tag and
  both decode into an object.</p>
  <h3>Multiple from msg</h3>
  <p>Reads the tags from the message property named in the <b>Tags</b> field, <code>msg.tags</code> by
  default. It can be:</p>
  <ul>
    <li>an array of tag names, e.g. <code>["Tag1", "MyArray[0..9]"]</code></li>
    <li>an array of objects, <code>{ name, dataType, arraySize }</code>. <code>tagName</code> is accepted in place of
    <code>name</code>. <code>dataType</code> (<i>ARRAY</i> or <i>STRUCT</i>) and <code>arraySize</code> (a positive
    whole number) are optional and apply to that tag only. The entries a cip-subscribe sends
    (<code>{ name, value, type, changed }</code>) are accepted.</li>
    <li>a comma separated string, e.g. <code>"Tag1, Tag2, Arr[1,2]"</code>. A comma inside square brackets stays
    part of the tag name.</li>
  </ul>
  <p>A cip-read wired after a cip-subscribe can read the subscribed tags this way.</p>
  <p><code>msg.payload</code> is an array of <code>{ tagName, value, type }</code> objects in the
  order requested, so <code>payload[2]</code> is always the result for <code>tags[2]</code>. A tag the PLC
  rejects, such as one that does not exist, has an <code>error</code> string in place of its value and
  does not stop the other tags being read. The node status turns yellow when that happens.</p>
  <p>An entry that is not valid, such as a number, an empty name, an object without a name or an
  <code>arraySize</code> that is not a positive whole number, fails the whole message before anything is
  read. The error lists every bad entry by position and can be caught with a Catch node.</p>

  <h3>Dynamic control</h3>
  <p>The PLC connection can be selected, re-pointed and controlled at runtime with
  <code>msg.endpoint</code> and <code>msg.action</code> when the endpoint has the
  <b>Dynamic</b> option enabled. See the <code>cip-endpoint</code> help for the
  full reference.</p>
</script>
