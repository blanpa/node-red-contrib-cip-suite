<script type="text/javascript">
  RED.nodes.registerType("cip-write", {
    category: "CIP Suite",
    color: "#999999",
    defaults: {
      name: { value: "" },
      endpoint: { value: "", type: "cip-endpoint", required: true },
      tagName: { value: "" },
      dataType: { value: "auto" },
      staticValue: { value: "" },
      useStaticValue: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "cip.svg",
    paletteLabel: "cip write",
    label: function () {
      return this.name || this.tagName || "cip write";
    },
    oneditprepare: function () {
      // Guarded, see the note on setupTagBrowse in cip-endpoint.html.
      if (window.cipSuiteEditor) {
        window.cipSuiteEditor.setupTagBrowse();
      } else {
        console.warn("cip-suite: tag browse unavailable, cip-endpoint's editor script did not load");
      }
    }
  });
</script>

<script type="text/html" data-template-name="cip-write">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-server"></i> Endpoint</label>
    <input type="text" id="node-input-endpoint" />
  </div>
  <div class="form-row">
    <label for="node-input-tagName"><i class="fa fa-bookmark"></i> Tag Name</label>
    <div style="display:flex; gap:4px;">
      <input type="text" id="node-input-tagName" placeholder="Program:MainProgram.MyTag" style="flex:1" />
      <button type="button" id="node-input-browse-btn" class="red-ui-button" title="Browse tags from PLC">
        <i class="fa fa-search"></i>
      </button>
    </div>
  </div>
  <div class="form-row" id="node-input-taglist-row" style="display:none;">
    <label><i class="fa fa-list"></i> Tags</label>
    <select id="node-input-taglist" size="8" style="width:70%; font-family:monospace;"></select>
  </div>
  <div class="form-row">
    <label for="node-input-dataType"><i class="fa fa-database"></i> Data Type</label>
    <select id="node-input-dataType">
      <option value="auto">Auto-detect</option>
      <option value="BOOL">BOOL</option>
      <option value="INT">INT (16-bit)</option>
      <option value="DINT">DINT (32-bit)</option>
      <option value="REAL">REAL (float)</option>
      <option value="STRING">STRING</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-useStaticValue"><i class="fa fa-pencil"></i> Static Value</label>
    <input type="checkbox" id="node-input-useStaticValue" style="width:auto" />
    <span>Use static value instead of msg.payload</span>
  </div>
  <div class="form-row">
    <label for="node-input-staticValue"><i class="fa fa-pencil-square-o"></i> Value</label>
    <input type="text" id="node-input-staticValue" placeholder="Static value" />
  </div>
</script>

<script type="text/html" data-help-name="cip-write">
  <p>Writes a value to a tag on an Allen-Bradley PLC via EtherNet/IP (CIP).</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">*</span></dt>
    <dd>The value to write (unless static value is configured).</dd>
    <dt>tagName <span class="property-type">string</span></dt>
    <dd>Optional override for the configured tag name.</dd>
  </dl>
  <p>For batch writes, set <code>msg.tags</code> to an array of objects, each with <code>name</code>
  and <code>value</code> properties. The tags are written one after another.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.success <span class="property-type">boolean</span></dt>
    <dd>Whether the write was successful.</dd>
    <dt>payload.tagName <span class="property-type">string</span></dt>
    <dd>The tag that was written.</dd>
    <dt>payload.value <span class="property-type">*</span></dt>
    <dd>The value that was written. Only on success.</dd>
    <dt>payload.error <span class="property-type">string</span></dt>
    <dd>Why the write failed, e.g. <code>Access goes past the end of the tag (CIP 0xff, extended 0x2105)</code>.
    Only on failure. A failed write also raises an error that a Catch node receives.</dd>
    <dt>payload.generalStatusCode, payload.extendedStatus <span class="property-type">number, array</span></dt>
    <dd>The CIP status codes, when the controller refused the write. They are absent when the node
    refused the value before sending it.</dd>
    <dt>payload.timestamp <span class="property-type">number</span></dt>
    <dd>Unix timestamp (ms) of the write.</dd>
  </dl>
  <h3>Details</h3>
  <p>Backpressure is applied: if a write is already in-flight, subsequent messages are dropped with a warning.</p>
  <p><b>Data Type:</b> the node reads each tag before writing it, so the controller's own type
  is always what gets written. With a type other than <i>Auto-detect</i> the node checks that the
  tag really has that type and fails the write otherwise, e.g. <code>MyDint is DINT, but the
  node's Data Type is REAL</code>. <i>STRING</i> also accepts Logix STRING tags, which are
  structures; custom string types such as STRING20 count as STRING here. Bit writes (<code>MyDint.5</code>) are not checked.</p>
  <p>Click the <i class="fa fa-search"></i> button next to the tag name field to browse available tags
  from the connected PLC. The endpoint must be deployed and connected first.</p>
  <h3>Tag Addressing</h3>
  <ul>
    <li><b>Bit-level writes:</b> Use dot notation, e.g. <code>MyDint.5</code> writes bit 5 of a DINT tag. The node reads the tag,
      changes the bit and writes the whole value back, so a change the controller makes in between is lost.
      A bit index past the tag's width (<code>MyInt.16</code>) fails, and so does bit access on REAL, LREAL, LINT, ULINT, LWORD and STRING tags.</li>
    <li><b>Numeric types:</b> BOOL, SINT, USINT, INT, UINT, DINT, UDINT, LINT, ULINT, REAL, LREAL, BYTE, WORD and LWORD can be written.
      A value out of an integer type's range fails the write. So does text on a numeric tag, e.g. <code>MyDint is a DINT, so it cannot take text</code>;
      numeric text such as <code>"65"</code> is written as the number. LINT, ULINT and LWORD take a BigInt, a number or digit text;
      use digit text or a BigInt for values past 2^53.</li>
    <li><b>Array writes:</b> Use bracket notation, e.g. <code>MyArray[3]</code> writes element 3. Pass an array as <code>msg.payload</code> to write multiple elements, starting at the element named:
      <code>MyArray[2]</code> with <code>[1,2,3]</code> writes elements 2 to 4. A range such as <code>MyArray[0..2]</code> takes an array of exactly that length.
      Every value is checked first, so a bad value leaves the array unchanged. More values than the array has left fail with
      <code>Access goes past the end of the tag</code>.</li>
    <li><b>Bare array name:</b> A tag name on its own addresses element 0, whatever the controller reports. A single value written to <code>MyArray</code> changes element 0 only,
      and an array payload is written from element 0. The read node can return the whole array for the same name when the PLC tag list is available (see its help),
      so write <code>MyArray[0..N]</code> to put back the elements you read.</li>
    <li><b>UDT writes:</b> Access UDT members with dot notation, e.g. <code>MyUDT.MemberName</code>,
    or send an object to a UDT tag, e.g. <code>{ "Speed": 50 }</code>. Only the members in the
    object change; the rest keep their current value. Nested UDTs work the same way, and an
    unknown member name fails the write.</li>
    <li><b>STRING writes:</b> Send text to a STRING tag, e.g. <code>MyString</code>, or to a STRING
    member by its path, e.g. <code>MyUDT.Name</code>, which leaves the other members alone. Text
    longer than the string fails the write instead of being cut off. The length is counted in
    bytes, so non-ASCII text (written as UTF-8) takes more than one per character.
    Write to the STRING tag itself, not to its <code>.DATA</code> member: that is the tag's
    character array, and the node refuses to write text to it.</li>
    <li><b>Program-scoped:</b> Use <code>Program:MainProgram.TagName</code> syntax.</li>
  </ul>
  <h3>Batch Mode</h3>
  <p>Send <code>msg.tags</code> as an array of <code>{ name: "TagName", value: 42 }</code> objects to
  write several tags, one after another. The output <code>msg.payload</code> is an array with one result per tag, in the order given.
  A tag that fails carries <code>success: false</code> and an <code>error</code>, and the remaining tags are still written.</p>

  <h3>Dynamic control</h3>
  <p>The PLC connection can be selected, re-pointed and controlled at runtime with
  <code>msg.endpoint</code> and <code>msg.action</code> when the endpoint has the
  <b>Dynamic</b> option enabled. See the <code>cip-endpoint</code> help for the
  full reference.</p>
</script>
