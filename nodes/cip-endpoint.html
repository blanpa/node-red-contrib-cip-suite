<script type="text/javascript">
  RED.nodes.registerType("cip-endpoint", {
    category: "config",
    defaults: {
      name: { value: "" },
      address: { value: "", required: true },
      port: { value: 44818 },
      slot: { value: 0 },
      routingPath: { value: "" },
      connTimeout: { value: 5000 },
      retryInterval: { value: 5000 },
      maxRetryInterval: { value: 60000 },
      keepAlive: { value: 30000 },
      autoConnect: { value: true },
      allowDynamic: { value: false },
      useMicro800: { value: false }
    },
    label: function () {
      return this.name || this.address + ":" + this.port;
    }
  });
</script>

<script type="text/html" data-template-name="cip-endpoint">
  <div class="form-row form-row-130">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Name" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-address"><i class="fa fa-globe"></i> IP Address</label>
    <input type="text" id="node-config-input-address" placeholder="192.168.1.1" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="number" id="node-config-input-port" placeholder="44818" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-slot"><i class="fa fa-microchip"></i> Slot</label>
    <input type="number" id="node-config-input-slot" placeholder="0" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-routingPath"><i class="fa fa-random"></i> Routing Path</label>
    <input type="text" id="node-config-input-routingPath" placeholder="e.g. 1/0 or 1/0/2/192.168.1.1" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-connTimeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
    <input type="number" id="node-config-input-connTimeout" placeholder="5000" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-retryInterval"><i class="fa fa-refresh"></i> Retry (ms)</label>
    <input type="number" id="node-config-input-retryInterval" placeholder="5000" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-maxRetryInterval"><i class="fa fa-refresh"></i> Max retry (ms)</label>
    <input type="number" id="node-config-input-maxRetryInterval" placeholder="60000" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-keepAlive"><i class="fa fa-heartbeat"></i> Keepalive (ms)</label>
    <input type="number" id="node-config-input-keepAlive" placeholder="30000" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-autoConnect"><i class="fa fa-play-circle"></i> Auto connect</label>
    <input type="checkbox" id="node-config-input-autoConnect" style="width:auto" />
    <span>Connect when a node using this endpoint starts</span>
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-allowDynamic"><i class="fa fa-random"></i> Dynamic Control</label>
    <input type="checkbox" id="node-config-input-allowDynamic" style="width:auto" />
    <span>Allow <code>msg.action</code> and <code>msg.endpoint</code> to control this connection</span>
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-useMicro800"><i class="fa fa-cog"></i> Micro800 Mode</label>
    <input type="checkbox" id="node-config-input-useMicro800" style="width:auto" />
    <span>Enable for Micro800 series (no slot routing)</span>
  </div>
</script>

<script type="text/javascript">
  // Shared tag-browse UI for the nodes that offer a Browse button.
  //
  // One implementation on purpose. Each node used to carry its own copy, the copies drifted,
  // and the copy in cip-browse omitted the option value. An <option> with no value attribute
  // falls back to its text, so that copy's values carried the type suffix.
  (function () {
    var ns = (window.cipSuiteEditor = window.cipSuiteEditor || {});

    /**
     * Wire the Browse button and tag list of the edit dialog that is currently open.
     *
     * Call from oneditprepare. Handlers bind to the dialog's own elements, so they are
     * discarded with the dialog. They used to be delegated from `document`, which left one
     * set alive per node type: a single click then fired a request for every type, and
     * whichever response arrived last owned the list.
     *
     * Callers reach this through `window.cipSuiteEditor` and check it first. Node-RED serves
     * every node's HTML at editor load and oneditprepare runs much later, so it is normally
     * present, but a cip-endpoint node set disabled in Manage Palette would not be served at
     * all. A bare identifier would then throw a ReferenceError inside oneditprepare and leave
     * the dialog half-built, where a property lookup on window just yields undefined and costs
     * the user nothing more than an inert Browse button.
     */
    ns.setupTagBrowse = function () {
      var $btn = $("#node-input-browse-btn");
      var $sel = $("#node-input-taglist");
      var $row = $("#node-input-taglist-row");
      // Absent on nodes that do not show one. jQuery no-ops on an empty set, so the
      // presence of an element is the whole configuration.
      var $status = $("#node-input-browse-status");
      var $name = $("#node-input-tagName");

      $btn.on("click", function () {
        var endpointId = $("#node-input-endpoint").val();
        if (!endpointId || endpointId === "_ADD_") {
          RED.notify("Select and deploy an endpoint first.", "warning");
          return;
        }
        $btn.prop("disabled", true).find("i").removeClass("fa-search").addClass("fa-spinner fa-spin");
        $status.text("Loading...");
        $.getJSON("cip-endpoint/" + endpointId + "/browse")
          .done(function (tags) {
            $sel.empty();
            if (!tags.length) {
              $sel.append('<option disabled>No tags found</option>');
              $status.text("No tags found");
            } else {
              tags.forEach(function (t) {
                // The type is shown to help you pick a tag and is never part of the value.
                // A controller reports types this dialog's Data Type list does not offer
                // (SINT, LINT, LREAL, UDT template names), so it stays advisory and Data
                // Type is left on Auto-detect.
                var label = t.name + (t.type ? "  (" + t.type + ")" : "");
                $sel.append($("<option>").val(t.name).text(label));
              });
              $status.text(tags.length + " tags");
            }
            $row.slideDown(200);
          })
          .fail(function (xhr) {
            RED.notify(xhr.responseJSON ? xhr.responseJSON.error : "Browse failed", "error");
            $status.text("");
          })
          .always(function () {
            $btn.prop("disabled", false).find("i").removeClass("fa-spinner fa-spin").addClass("fa-search");
          });
      });

      // cip-browse lists tags as its own output and has no field to fill.
      if (!$name.length) {
        return;
      }

      var apply = function (collapse) {
        var name = $sel.val();
        if (!name) {
          return;
        }
        $name.val(name);
        if (collapse) {
          $row.slideUp(200);
        }
      };
      $sel.on("change", function () {
        apply(false);
      });
      $sel.on("dblclick", function () {
        apply(true);
      });
    };
  })();
</script>

<style>
  /* The labels are too long and wrap poorly! */
  .form-row.form-row-130 label {
    width: 130px;
  }
</style>

<script type="text/html" data-help-name="cip-endpoint">
  <p>A shared EtherNet/IP session to one CIP device. Every CIP node that talks to a
  PLC points at one of these, and they all share the single connection it owns.</p>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>IP Address <span class="property-type">string</span></dt>
    <dd>Hostname or IP of the controller. The <b>Port</b> field is currently informational:
    EtherNet/IP is always contacted on 44818.</dd>
    <dt>Slot <span class="property-type">number</span></dt>
    <dd>Backplane slot of the CPU. Leave at 0 for controllers with no backplane.</dd>
    <dt>Routing Path <span class="property-type">string</span></dt>
    <dd>CIP route to a controller reached through one or more bridge modules, written as
    <code>port/link</code> pairs. <code>1/0</code> means backplane port 1, slot 0.
    <code>1/0/2/192.168.1.1</code> crosses the backplane to slot 0, then leaves port 2 to a
    second chassis at that address. An <b>even</b> number of segments is required, since
    each hop is a pair: an odd count is ignored and no routing is applied. Leave empty for
    a directly addressed controller.</dd>
    <dt>Timeout (ms) <span class="property-type">number</span></dt>
    <dd>How long a single CIP request may take before it is abandoned. Also bounds how long
    a connect attempt waits before it reports failure.</dd>
    <dt>Retry / Max retry (ms) <span class="property-type">number</span></dt>
    <dd>Reconnect backoff. Doubles from <b>Retry</b> up to <b>Max retry</b>, with jitter so
    that several endpoints recovering from one outage do not retry in lockstep. Set them
    equal for a flat interval.</dd>
    <dt>Keepalive (ms)<span class="property-type">number</span></dt>
    <dd>Interval between Identity object reads that hold the session open. Controllers close
    idle sessions: a Micro850 does so after 120 seconds. 0 disables.</dd>
    <dt>Auto connect <span class="property-type">boolean</span></dt>
    <dd>Connect as soon as a node using this endpoint starts. Turn it off to leave the
    session idle until an explicit <code>connect</code> action arrives.</dd>
    <dt>Dynamic control<span class="property-type">boolean</span></dt>
    <dd>Opt in to permit runtime control of the endpoint. While it is off, <code>msg.action</code> and
    <code>msg.endpoint</code> are ignored by every node using this endpoint.</dd>
    <dt>Micro800 Mode <span class="property-type">boolean</span></dt>
    <dd>Required for Micro820/850/870. They reject the connected messaging (ForwardOpen)
    used by Logix controllers, so this switches to unconnected UCMM messaging. A CIP status
    <code>0x01</code> on connect usually means this needs enabling.</dd>
  </dl>

  <h3>Dynamic control</h3>
  <p>With <b>Dynamic</b> option enabled, any node using this endpoint can select,
  re-point and control the connection from the message stream. A message carrying
  <code>msg.action</code> performs that action and does <b>no</b> PLC I/O, so a
  <code>cip-read</code> given an action does not read.</p>

  <p>Important distinction:</p>
  <ul>
    <li>The <code>"switch"</code> action affects <b>one node</b>. It changes which endpoint that node
    uses. Other nodes are unaffected.</li>
    <li>All other dynamic control (connecting, disconnecting, reconnecting, modifying) affects
    <b>the endpoint</b> and every node that uses it.</li>
  </ul>

  <h4>Actions</h4>
  <dl class="message-properties">
    <dt>action <span class="property-type">string</span></dt>
    <dd><code>"switch"</code> re-points the receiving node at the endpoint named in
    <code>msg.endpoint</code>, without connecting or disconnecting anything.<br/>
    <code>"connect"</code> connects. Already connected with no override is a no-op
    success.<br/>
    <code>"disconnect"</code> disconnects and stops retrying until told otherwise.<br/>
    <code>"reconnect"</code> forces a disconnect then connect. Also refreshes the tag
    list.<br/>
    <code>"status"</code> emits connection state and metrics, including the
    <code>id</code> and <code>name</code> of the endpoint that answered.</dd>
  </dl>

  <h4>Choosing an endpoint</h4>
  <p>Naming an endpoint always says <i>which endpoint this message is about</i>. Whether the
  node then remains set to that endpoint follows depends on the following:</p>
  <ul>
    <li><code>switch</code>, <code>connect</code> and <code>reconnect</code> all re-point the node when
    the endpoint name is specified.</li>
    <li><code>disconnect</code> and <code>status</code> act on the current/active or named endpoint and
    leave the node associated with its currently active endpoint.</li>
    <li>A message with <b>no</b> <code>msg.action</code> borrows the named endpoint for that
    one read or write and leaves the node where it was. This is what makes
    <i>read this tag from PLC2</i> a single message. The next message with no
    <code>msg.endpoint</code> goes back to the configured endpoint, so a one-off read cannot
    quietly redirect everything that follows. Use <code>switch</code> to move a node for good.</li>
  </ul>
  <p>An endpoint borrowed this way is connected on demand if it is not already up, so it
  works with <b>Auto connect</b> off. <code>cip-subscribe</code> is the exception: it holds a
  scan loop rather than answering one message at a time, so there is nothing to borrow an
  endpoint for and it asks you to use <code>switch</code>.</p>
  <dl class="message-properties">
    <dt class="optional">endpoint <span class="property-type">string</span></dt>
    <dd>The id, or the configured <b>Name</b>, of a deployed <code>cip-endpoint</code>. Both
    the current endpoint and the one being assigned must allow dynamic updates. A name
    matching more than one endpoint is an error.</dd>
    <dt class="optional">endpoint <span class="property-type">object</span></dt>
    <dd>With <code>target: "config"</code>, changes this endpoint's settings in place:
    <code>address</code>, <code>port</code>, <code>slot</code>, <code>connTimeout</code>,
    <code>retryInterval</code>, <code>maxRetryInterval</code>, <code>keepAlive</code>,
    <code>useMicro800</code>, <code>routingPath</code>. Only the properties you supply
    change. Requires <code>msg.action = "connect"</code>, since connecting is the only
    time new settings are applied. Sent with any other action, it is rejected
    rather than silently dropped. On a live connection it is refused unless you add
    <code>force: true</code> (force cycles the connection).</dd>
  </dl>

  <p>An endpoint you switch away from is left connected. Nothing disconnects it until the
  flow stops or it is sent a <code>"disconnect"</code>. Runtime changes are not saved: a
  full deploy restores whatever is configured here.</p>

  <h4>Examples</h4>
  <pre>// Read a tag from a different endpoint than the one configured on this node
msg.endpoint = "PLC2";
msg.tagName = "Line1.Speed";
// Switch this node to a different endpoint for all future messages
msg.action = "switch";
msg.endpoint = "PLC2";
// Get the connection status of the endpoint this node is using
msg.action = "status";
// Get the connection status of the config endpoint named "PLC2"
msg.action = "status";
msg.endpoint = "PLC2";
// Alter the address of the config endpoint named "PLC2" and reconnect (affects all nodes using it)
msg.action = "connect";
msg.endpoint = { target: "config", address: "10.0.0.5", force: true };</pre>
</script>
