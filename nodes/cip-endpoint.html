<script type="text/javascript">
  RED.nodes.registerType("cip-endpoint", {
    category: "config",
    defaults: {
      name: { value: "" },
      address: { value: "", required: true },
      port: { value: 44818 },
      slot: { value: 0 },
      routingPath: { value: "" },
      connTimeout: { value: 5000 },
      retryInterval: { value: 5000 },
      maxRetryInterval: { value: 60000 },
      keepAlive: { value: 30000 },
      autoConnect: { value: true },
      allowDynamic: { value: false },
      useMicro800: { value: false }
    },
    label: function () {
      return this.name || this.address;
    }
  });
</script>

<script type="text/html" data-template-name="cip-endpoint">

    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>

  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-address"><i class="fa fa-globe"></i> IP Address</label>

  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="number" id="node-config-input-port" placeholder="44818" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-slot"><i class="fa fa-microchip"></i> Slot</label>
    <input type="number" id="node-config-input-slot" placeholder="0" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-routingPath"><i class="fa fa-random"></i> Routing Path</label>
    <input type="text" id="node-config-input-routingPath" placeholder="e.g. 1/0 or 1/0/2/192.168.1.1" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-connTimeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>

  </div>
  <div class="form-row form-row-130">

    <input type="number" id="node-config-input-retryInterval" placeholder="5000" />
  </div>
  <div class="form-row form-row-130">
    <label for="node-config-input-maxRetryInterval"><i class="fa fa-refresh"></i> Max retry (ms)</label>

  <div class="form-row form-row-130">
    <label for="node-config-input-keepAlive"><i class="fa fa-heartbeat"></i> Keepalive (ms)</label>

  <div class="form-row form-row-130">
    <label for="node-config-input-autoConnect"><i class="fa fa-play-circle"></i> Auto connect</label>
    <input type="checkbox" id="node-config-input-autoConnect" style="width:auto" />
    <span>Connect when a node using this endpoint starts</span>

  <div class="form-row form-row-130">
    <label for="node-config-input-allowDynamic"><i class="fa fa-random"></i> Dynamic Control</label>
    <input type="checkbox" id="node-config-input-allowDynamic" style="width:auto" />
    <span>Allow <code>msg.action</code> and <code>msg.endpoint</code> to control this connection</span>
  </div>
  <div class="form-row form-row-130">

  </div>
</script>

<script type="text/javascript">
  // Shared tag-browse UI for the nodes that offer a Browse button.
  //
  // One implementation on purpose. Each node used to carry its own copy, the copies drifted,
  // and the copy in cip-browse omitted the option value. An <option> with no value attribute
  // falls back to its text, so that copy's values carried the type suffix.
  (function () {
    var ns = (window.cipSuiteEditor = window.cipSuiteEditor || {});

    /**
     * Wire the Browse button and tag list of the edit dialog that is currently open.
     *
     * Call from oneditprepare. Handlers bind to the dialog's own elements, so they are
     * discarded with the dialog. They used to be delegated from `document`, which left one
     * set alive per node type: a single click then fired a request for every type, and
     * whichever response arrived last owned the list.
     *
     * Callers reach this through `window.cipSuiteEditor` and check it first. Node-RED serves
     * every node's HTML at editor load and oneditprepare runs much later, so it is normally
     * present, but a cip-endpoint node set disabled in Manage Palette would not be served at
     * all. A bare identifier would then throw a ReferenceError inside oneditprepare and leave
     * the dialog half-built, where a property lookup on window just yields undefined and costs
     * the user nothing more than an inert Browse button.
     */
    /**
     * Focus a field with the caret at the end of its text, so a picked tag can be extended
     * with an index such as [3]. A typed input shows its text in its own field, next to the
     * hidden original, so that is the one to focus.
     */
    ns.focusEnd = function ($input) {
      // After the dropdown has gone, or the removal of its focused filter box takes the focus.
      setTimeout(function () {
        var $shown = $input.nextAll(".red-ui-typedInput-container").first().find("input.red-ui-typedInput-input");
        var el = ($shown.length ? $shown : $input)[0];
        if (!el) {
          return;
        }
        el.focus();
        if (typeof el.setSelectionRange === "function") {
          try {
            el.setSelectionRange(el.value.length, el.value.length);
          } catch (e) {
            /* not a text field */
          }
        }
      }, 0);
    };

    /** A msg typed input starts on a useful property name instead of empty. */
    ns.defaultOnMsg = function ($input, property) {
      $input.on("typedinputtypechange", function () {
        if ($input.typedInput("type") === "msg" && !$input.typedInput("value")) {
          $input.typedInput("value", property);
        }
      });
    };

    /** Browsing fills a string, so it is off for a tag that comes from msg or an env variable. */
    ns.syncBrowse = function ($input, $button) {
      function sync() {
        var browsable = $input.typedInput("type") === "str";
        $button
          .prop("disabled", !browsable)
          .attr("title", browsable ? "Browse tags from PLC" : "Browse is only available for a string tag");
      }
      $input.on("typedinputtypechange", sync);
      sync();
    };

    /**
     * A typed input that fills its field: types, the hidden input that stores the type, the
     * type to start on. `options.msg` names the property a msg type starts on.
     */
    ns.typed = function ($input, options) {
      $input.typedInput({ types: options.types, typeField: options.typeField, default: options.default });
      $input.typedInput("width", "100%");
      if (options.msg) {
        ns.defaultOnMsg($input, options.msg);
      }
      return $input;
    };

    /**
     * A tag cell for a list row: a typed input (str and env, plus whatever `types` adds), its
     * Browse button, and the wiring that sets the tag from the picker. Returns the typed input.
     */
    ns.rowTag = function (browser, $input, $button, data, types) {
      $input.typedInput({ types: types || ["str", "env"], default: data.tagNameType || "str" });
      ns.defaultOnMsg($input, "payload");
      $input.typedInput("width", "100%");
      // A row is built before it is attached, so its width is measured again once it has a place
      setTimeout(function () {
        $input.typedInput("width", "100%");
      }, 0);
      $input.typedInput("type", data.tagNameType || "str");
      $input.typedInput("value", data.tagName || "");
      ns.syncBrowse($input, $button);
      $button.on("click", function () {
        if (!browser) {
          RED.notify("Tag browse is unavailable: the cip-endpoint editor script did not load.", "warning");
          return;
        }
        browser.browse(
          $button,
          function (name) {
            $input.typedInput("type", "str");
            $input.typedInput("value", name);
            ns.focusEnd($input);
          },
          $input.typedInput("type") === "str" ? $input.typedInput("value") : ""
        );
      });
      return $input;
    };

    /**
     * The tag list of a Multiple style dialog: a sortable list with an add button.
     *
     * `options.addItem(row, data)` builds a row and returns the field to focus. The list grows
     * with its rows up to the free space in the dialog and never below 150px, and the grip at
     * its bottom right sets a height of the user's own, which then stays. The add button has an
     * accesskey: Alt+T in Chrome and Edge, Alt+Shift+T in Firefox, Ctrl+Option+T on a Mac. Not
     * A, since Node-RED binds a chord that starts with Alt+A. A browser does not mark the
     * letter, so it is underlined here. `node._fitList` lets oneditresize refit the list.
     */
    ns.setupList = function (node, $list, options) {
      var loading = true;
      var label = options.label || "tag";
      $list.css("min-height", "150px").editableList({
        sortable: true,
        removable: true,
        addButton: "add " + label,
        addItem: function (row, index, data) {
          var $focus = options.addItem(row, data || {});
          // A row added by the user is ready to type in. Rows added while the dialog loads are not.
          if (!loading && $focus) {
            setTimeout(function () {
              if (row[0] && row[0].scrollIntoView) {
                row[0].scrollIntoView({ block: "nearest" });
              }
              ns.focusEnd($focus);
            }, 0);
          }
        }
      });
      $list.editableList("addItems", options.items || []);
      loading = false;

      var $box = $list.parent();
      var userHeight = null;
      var setHeight = 0;
      var fit = function () {
        if (!$box.is(":visible")) {
          return;
        }
        var wanted = userHeight;
        if (wanted === null) {
          var free = node._freeHeight || 400;
          wanted = Math.max(150, Math.min($list.outerHeight() + 16, free));
        }
        setHeight = Math.round(wanted);
        $box.css("height", setHeight);
      };
      $box.on("mouseup", function () {
        var now = $box.outerHeight();
        if (Math.abs(now - setHeight) > 2) {
          userHeight = now;
          setHeight = now;
        }
      });
      node._fitList = fit;
      var fitSoon = function () {
        setTimeout(fit, 0);
      };
      $list.on("click keyup", fitSoon);
      var $add = $("#dialog-form " + (options.scope || ".cip-multiple") + " .red-ui-editableList-addButton");
      $add.on("click", fitSoon);
      $add
        .attr({ accesskey: "t", title: "Add a " + label + " (accesskey T)" })
        .empty()
        .append('<i class="fa fa-plus"></i> ')
        .append($("<span/>").html("add <u>t</u>" + label.slice(1)));
      fitSoon();
      return { fit: fit };
    };

    /** For oneditresize: what the dialog has left once every other row has taken its share. */
    ns.fitFreeHeight = function (node, size, scope) {
      scope = scope || ".cip-multiple";
      var used = 0;
      $("#dialog-form")
        .children("div")
        .each(function () {
          var $row = $(this);
          if ($row.is(":visible") && !$row.is(scope)) {
            used += $row.outerHeight(true);
          }
        });
      var other = 0;
      $("#dialog-form " + scope)
        .children()
        .each(function () {
          if (!$(this).find(".red-ui-editableList").length && !$(this).is(".red-ui-editableList")) {
            other += $(this).outerHeight(true);
          }
        });
      node._freeHeight = Math.max(150, size.height - used - other - 60);
      if (node._fitList) {
        node._fitList();
      }
    };

    /**
     * Run `callback` after the rows of a list have changed (added, removed, moved). Watches the
     * list itself, since a removed row goes after the click that removed it has finished.
     */
    ns.onListChange = function ($list, callback) {
      var pending = null;
      new MutationObserver(function () {
        clearTimeout(pending);
        pending = setTimeout(callback, 0);
      }).observe($list[0], { childList: true });
    };

    ns.setupTagBrowse = function () {
      var $btn = $("#node-input-browse-btn");
      var $sel = $("#node-input-taglist");
      var $row = $("#node-input-taglist-row");
      // Absent on nodes that do not show one. jQuery no-ops on an empty set, so the
      // presence of an element is the whole configuration.
      var $status = $("#node-input-browse-status");
      var $name = $("#node-input-tagName");

      // Where a picked tag goes. The Browse button that loaded the list sets it, so one
      // list serves the Tag Name field and any number of per-row buttons.
      var pick = null;

      var fillName = function (name) {
        $name.val(name);
        // A typed input keeps its own copy of the value and shows a picked tag as a str.
        // On a plain input this throws, and the line above has already done the work.
        try {
          $name.typedInput("type", "str");
          $name.typedInput("value", name);
        } catch (e) {
          /* not a typed input */
        }
        ns.focusEnd($name);
      };

      // A dialog with no inline tag list gets a dropdown under the Browse button instead.
      var inline = $sel.length > 0;
      var MAX_SHOWN = 300;
      var $pop = null;

      var closePop = function () {
        if ($pop) {
          $pop.remove();
          $pop = null;
        }
        $(document).off(".cipTagPop");
      };

      /** Drop a filterable list of tags under `$anchor`. Choosing one calls `onPick(name)`. */
      var showPop = function ($anchor, tags, onPick, current) {
        closePop();
        // Inside the tray, so it goes when the dialog does and is not clipped by the form.
        var $host = $anchor.closest(".red-ui-tray");
        $pop = $("<div/>", { class: "cip-tag-pop" }).appendTo($host.length ? $host : $(document.body));
        var $filter = $("<input/>", {
          type: "text",
          class: "cip-tag-pop-filter",
          placeholder: "Filter " + tags.length + " tags by name or type"
        }).appendTo($pop);
        var $list = $("<ul/>", { class: "cip-tag-pop-list" }).appendTo($pop);
        var $note = $("<div/>", { class: "cip-tag-pop-note" }).appendTo($pop);
        var rows = [];
        var active = -1;

        // What a tag is matched against: its name and its type, in full and with the
        // punctuation taken out, so "em di 01" finds _IO_EM_DI_01 and "emdi01" does too.
        // A space, underscore, dot or dash in the filter stands for one or more of those in
        // the name, so "em di 01" finds _IO_EM_DI_01 and "st a" finds st_art but not _start.
        // Anything else must match as typed, anywhere in the name. A word that starts the tag's
        // type ("bool", "dint", "string" for SHORT_STRING) filters on the type instead.
        var SEP = /[\s_.\-]+/;
        var namePattern = function (words) {
          if (!words.length) {
            return null;
          }
          return new RegExp(
            words
              .join(" ")
              .split(SEP)
              .map(function (part) {
                return part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              })
              .join("[^a-z0-9]+")
          );
        };
        var isTypeWord = function (type, word) {
          return word.length > 1 && type.split("_").concat(type).some(function (token) {
            return token.indexOf(word) === 0;
          });
        };
        var haystacks = tags.map(function (t) {
          return {
            name: String(t.name).toLowerCase(),
            type: typeof t.type === "string" ? t.type.toLowerCase() : ""
          };
        });
        var matches = function (words, index) {
          var h = haystacks[index];
          var whole = namePattern(words);
          if (whole.test(h.name)) {
            return true;
          }
          var rest = words.filter(function (word) {
            return !isTypeWord(h.type, word);
          });
          if (rest.length === words.length) {
            return false;
          }
          var pattern = namePattern(rest);
          return !pattern || pattern.test(h.name);
        };

        var setActive = function (index) {
          $list.children(".active").removeClass("active");
          active = rows.length ? Math.max(0, Math.min(index, rows.length - 1)) : -1;
          if (active >= 0) {
            var li = $list.children().eq(active).addClass("active")[0];
            if (li && li.scrollIntoView) {
              li.scrollIntoView({ block: "nearest" });
            }
          }
        };
        var choose = function (name) {
          closePop();
          if (onPick) {
            onPick(name);
          }
        };
        // The first list shows the field's current tag, if the controller has it, in view and
        // selected. Later renders follow the filter.
        var showCurrent = typeof current === "string" && current !== "";
        var render = function () {
          var words = $.trim($filter.val()).toLowerCase().split(/[\s,]+/).filter(Boolean);
          var found = tags.filter(function (t, index) {
            return !words.length || matches(words, index);
          });
          var from = 0;
          var currentAt = -1;
          if (showCurrent && !words.length) {
            found.some(function (t, index) {
              if (t.name === current) {
                currentAt = index;
                return true;
              }
              return false;
            });
            if (currentAt >= MAX_SHOWN) {
              from = Math.max(0, Math.min(currentAt - 50, found.length - MAX_SHOWN));
            }
          }
          rows = found.slice(from, from + MAX_SHOWN);
          $list.empty();
          rows.forEach(function (t) {
            // The type helps you pick a tag and is never part of the value. A controller
            // reports types the Data Type list does not offer (SINT, LINT, LREAL, UDT
            // template names), so it stays advisory.
            var $li = $("<li/>").data("name", t.name).appendTo($list);
            $("<span/>", { class: "cip-tag-pop-name" }).text(t.name).appendTo($li);
            if (t.type && typeof t.type === "string") {
              $("<span/>", { class: "cip-tag-pop-type" }).text(t.type).appendTo($li);
            }
          });
          $note
            .text(
              !found.length
                ? tags.length
                  ? "No tags match"
                  : "No tags found"
                : found.length > MAX_SHOWN
                  ? "Showing " + MAX_SHOWN + " of " + found.length + ". Type to narrow."
                  : ""
            )
            .toggle(!rows.length || found.length > MAX_SHOWN);
          if (currentAt >= 0) {
            setActive(currentAt - from);
            var li = $list.children(".active")[0];
            if (li) {
              var offset = li.getBoundingClientRect().top - $list[0].getBoundingClientRect().top;
              $list[0].scrollTop += offset - ($list[0].clientHeight - li.offsetHeight) / 2;
            }
          } else {
            setActive(0);
          }
          showCurrent = false;
        };

        $list.on("mousedown", "li", function (e) {
          e.preventDefault();
          choose($(this).data("name"));
        });
        $filter.on("input", render);
        $filter.on("keydown", function (e) {
          // These keys are handled here. Left to bubble, the editor's key handler runs after
          // Enter has removed this box and fails on the detached target.
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            e.stopPropagation();
            setActive(active + (e.key === "ArrowDown" ? 1 : -1));
          } else if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            if (active >= 0) {
              choose(rows[active].name);
            }
          } else if (e.key === "Escape") {
            // Only close the dropdown, not the edit dialog behind it.
            e.preventDefault();
            e.stopPropagation();
            closePop();
          }
        });
        $(document).on("mousedown.cipTagPop", function (e) {
          if (!$pop || !$.contains(document.documentElement, $pop[0])) {
            closePop();
          } else if (!$(e.target).closest($pop).length && !$(e.target).closest($anchor).length) {
            closePop();
          }
        });

        // Under the button with its right edge on the button's, since the button sits at the
        // right of its field, and kept inside the tray. Above it when there is no room below.
        var a = $anchor[0].getBoundingClientRect();
        var bounds = $host.length ? $host[0].getBoundingClientRect() : { left: 0, right: window.innerWidth };
        var width = Math.min(360, bounds.right - bounds.left - 12);
        $pop.css({ width: width, left: Math.max(bounds.left + 6, Math.min(a.right - width, bounds.right - width - 6)) });
        var below = window.innerHeight - a.bottom;
        var need = Math.min(340, $pop.outerHeight());
        if (below < need + 12 && a.top > below) {
          $pop.css({ bottom: window.innerHeight - a.top + 2, top: "auto" });
        } else {
          $pop.css({ top: a.bottom + 2 });
        }
        render();
        $filter.trigger("focus");
      };

      /** Load the controller's tags. `onPick(name)` receives the chosen tag. */
      var load = function ($button, onPick, current) {
        var endpointId = $("#node-input-endpoint").val();
        if (!endpointId || endpointId === "_ADD_") {
          RED.notify("Select and deploy an endpoint first.", "warning");
          return;
        }
        pick = onPick;
        closePop();
        $button.prop("disabled", true).find("i").removeClass("fa-search").addClass("fa-spinner fa-spin");
        $status.text("Loading...");
        $.getJSON("cip-endpoint/" + endpointId + "/browse")
          .done(function (tags) {
            if (!inline) {
              showPop($button, tags, onPick, current);
              return;
            }
            $sel.empty();
            if (!tags.length) {
              $sel.append('<option disabled>No tags found</option>');
              $status.text("No tags found");
            } else {
              tags.forEach(function (t) {
                // The type is shown to help you pick a tag and is never part of the value.
                // A controller reports types this dialog's Data Type list does not offer
                // (SINT, LINT, LREAL, UDT template names), so it stays advisory and Data
                // Type is left on Auto-detect.
                var label = t.name + (t.type && typeof t.type === "string" ? "  (" + t.type + ")" : "");
                $sel.append($("<option>").val(t.name).text(label));
              });
              $status.text(tags.length + " tags");
            }
            $row.slideDown(200);
          })
          .fail(function (xhr) {
            RED.notify(xhr.responseJSON ? xhr.responseJSON.error : "Browse failed", "error");
            $status.text("");
          })
          .always(function () {
            $button.prop("disabled", false).find("i").removeClass("fa-spinner fa-spin").addClass("fa-search");
          });
      };

      // cip-browse lists tags as its own output and has no field to fill, so it picks nothing.
      $btn.on("click", function () {
        var current = "";
        try {
          current = $name.typedInput("type") === "str" ? $name.typedInput("value") : "";
        } catch (e) {
          current = $name.val() || "";
        }
        load($btn, $name.length ? fillName : null, current);
      });

      var apply = function (collapse) {
        var name = $sel.val();
        if (!name || !pick) {
          return;
        }
        pick(name);
        if (collapse) {
          $row.slideUp(200);
        }
      };
      $sel.on("change", function () {
        apply(false);
      });
      $sel.on("dblclick", function () {
        apply(true);
      });

      // For a node with its own Browse buttons, such as one per row of a list.
      return { browse: load };
    };
  })();
</script>

<style>
  /* The tag dropdown under a Browse button, see setupTagBrowse(). It is fixed to the
     viewport and sits inside the edit tray, so the form's overflow does not clip it. */
  .cip-tag-pop {
    position: fixed;
    z-index: 20;
    box-sizing: border-box;
    padding: 6px;
    background: var(--red-ui-secondary-background, #fff);
    border: 1px solid var(--red-ui-primary-border-color, #bbb);
    border-radius: 4px;
    box-shadow: 0 4px 14px var(--red-ui-shadow, rgba(0, 0, 0, 0.25));
  }
  .cip-tag-pop .cip-tag-pop-filter {
    box-sizing: border-box;
    width: 100%;
    margin: 0 0 6px 0;
  }
  .cip-tag-pop-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 240px;
    overflow-y: auto;
  }
  .cip-tag-pop-list li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 3px 6px;
    cursor: pointer;

  /* The labels are too long and wrap poorly! */

  /* Stock fields are 70% wide after a 100px label. Match that so every control ends at the
     same edge at any tray width. A typed input sizes itself from its element when it is built
     and comes out narrower than its wrapper, so its container is pinned to the wrapper. */

  .cip-field .red-ui-typedInput-container,

  /* Grip at the bottom right to size the list. */

  /* A tip wraps inside its row. contain stops its text from setting the minimum width of the

<script type="text/html" data-help-name="cip-endpoint">
  <p>A shared EtherNet/IP session to one CIP device. Every CIP node that talks to a
  PLC points at one of these, and they all share the single connection it owns.</p>

  <h3>Settings</h3>
  <dl class="message-properties">
    <dt>IP Address <span class="property-type">string</span></dt>
    <dd>Hostname or IP of the controller.</dd>
    <dt>Port <span class="property-type">number</span></dt>
    <dd>TCP port of the EtherNet/IP session, 44818 by default. Change it only when the
    controller is reached through port forwarding, a tunnel or a container port mapping
    on another port.</dd>
    <dt>Slot <span class="property-type">number</span></dt>
    <dd>Backplane slot of the CPU. Leave at 0 for controllers with no backplane.</dd>
    <dt>Routing Path <span class="property-type">string</span></dt>
    <dd>CIP route to a controller reached through one or more bridge modules, written as
    <code>port/link</code> pairs. <code>1/0</code> means backplane port 1, slot 0.
    <code>1/0/2/192.168.1.1</code> crosses the backplane to slot 0, then leaves port 2 to a
    second chassis at that address. An <b>even</b> number of segments is required, since
    each hop is a pair: an odd count is ignored and no routing is applied. Leave empty for
    a directly addressed controller.</dd>
    <dt>Timeout (ms) <span class="property-type">number</span></dt>
    <dd>How long a single CIP request may take before it is abandoned. Also bounds how long
    a connect attempt waits before it reports failure.</dd>
    <dt>Retry / Max retry (ms) <span class="property-type">number</span></dt>
    <dd>Reconnect backoff. Doubles from <b>Retry</b> up to <b>Max retry</b>, with jitter so
    that several endpoints recovering from one outage do not retry in lockstep. Set them
    equal for a flat interval.</dd>
    <dt>Keepalive (ms)<span class="property-type">number</span></dt>
    <dd>Interval between Identity object reads that hold the session open. Controllers close
    idle sessions: a Micro850 does so after 120 seconds. 0 disables.</dd>
    <dt>Auto connect <span class="property-type">boolean</span></dt>
    <dd>Connect as soon as a node using this endpoint starts. Turn it off to leave the
    session idle until an explicit <code>connect</code> action arrives.</dd>
    <dt>Dynamic control<span class="property-type">boolean</span></dt>
    <dd>Opt in to permit runtime control of the endpoint. While it is off, <code>msg.action</code> and
    <code>msg.endpoint</code> are ignored by every node using this endpoint.</dd>
    <dt>Micro800 Mode <span class="property-type">boolean</span></dt>
    <dd>Required for Micro820/850/870. They reject the connected messaging (ForwardOpen)
    used by Logix controllers, so this switches to unconnected UCMM messaging. A CIP status
    <code>0x01</code> on connect usually means this needs enabling.</dd>
  </dl>

  <h3>Dynamic control</h3>
  <p>With <b>Dynamic</b> option enabled, any node using this endpoint can select,
  re-point and control the connection from the message stream. A message carrying
  <code>msg.action</code> performs that action and does <b>no</b> PLC I/O, so a
  <code>cip-read</code> given an action does not read.</p>

  <p>Important distinction:</p>
  <ul>
    <li>The <code>"switch"</code> action affects <b>one node</b>. It changes which endpoint that node
    uses. Other nodes are unaffected.</li>
    <li>All other dynamic control (connecting, disconnecting, reconnecting, modifying) affects
    <b>the endpoint</b> and every node that uses it.</li>
  </ul>

  <h4>Actions</h4>
  <dl class="message-properties">
    <dt>action <span class="property-type">string</span></dt>
    <dd><code>"switch"</code> re-points the receiving node at the endpoint named in
    <code>msg.endpoint</code>, without connecting or disconnecting anything.<br/>
    <code>"connect"</code> connects. Already connected with no override is a no-op
    success.<br/>
    <code>"disconnect"</code> disconnects and stops retrying until told otherwise.<br/>
    <code>"reconnect"</code> forces a disconnect then connect. Also refreshes the tag
    list.<br/>
    <code>"status"</code> emits connection state and metrics, including the
    <code>id</code> and <code>name</code> of the endpoint that answered.</dd>
  </dl>

  <h4>Choosing an endpoint</h4>
  <p>Naming an endpoint always says <i>which endpoint this message is about</i>. Whether the
  node then remains set to that endpoint follows depends on the following:</p>
  <ul>
    <li><code>switch</code>, <code>connect</code> and <code>reconnect</code> all re-point the node when
    the endpoint name is specified.</li>
    <li><code>disconnect</code> and <code>status</code> act on the current/active or named endpoint and
    leave the node associated with its currently active endpoint.</li>
    <li>A message with <b>no</b> <code>msg.action</code> borrows the named endpoint for that
    one read or write and leaves the node where it was. This is what makes
    <i>read this tag from PLC2</i> a single message. The next message with no
    <code>msg.endpoint</code> goes back to the configured endpoint, so a one-off read cannot
    quietly redirect everything that follows. Use <code>switch</code> to move a node for good.</li>
  </ul>
  <p>An endpoint borrowed this way is connected on demand if it is not already up, so it
  works with <b>Auto connect</b> off. <code>cip-subscribe</code> is the exception: it holds a
  scan loop rather than answering one message at a time, so there is nothing to borrow an
  endpoint for and it asks you to use <code>switch</code>.</p>
  <dl class="message-properties">
    <dt class="optional">endpoint <span class="property-type">string</span></dt>
    <dd>The id, or the configured <b>Name</b>, of a deployed <code>cip-endpoint</code>. Both
    the current endpoint and the one being assigned must allow dynamic updates. A name
    matching more than one endpoint is an error.</dd>
    <dt class="optional">endpoint <span class="property-type">object</span></dt>
    <dd>With <code>target: "config"</code>, changes this endpoint's settings in place:
    <code>address</code>, <code>port</code>, <code>slot</code>, <code>connTimeout</code>,
    <code>retryInterval</code>, <code>maxRetryInterval</code>, <code>keepAlive</code>,
    <code>useMicro800</code>, <code>routingPath</code>. Only the properties you supply
    change. Requires <code>msg.action = "connect"</code>, since connecting is the only
    time new settings are applied. Sent with any other action, it is rejected
    rather than silently dropped. On a live connection it is refused unless you add
    <code>force: true</code> (force cycles the connection).</dd>
  </dl>

  <p>An endpoint you switch away from is left connected. Nothing disconnects it until the
  flow stops or it is sent a <code>"disconnect"</code>. Runtime changes are not saved: a
  full deploy restores whatever is configured here.</p>

  <h4>Examples</h4>
  <pre>// Read a tag from a different endpoint than the one configured on this node
msg.endpoint = "PLC2";
msg.tagName = "Line1.Speed";
// Switch this node to a different endpoint for all future messages
msg.action = "switch";
msg.endpoint = "PLC2";
// Get the connection status of the endpoint this node is using
msg.action = "status";
// Get the connection status of the config endpoint named "PLC2"
msg.action = "status";
msg.endpoint = "PLC2";
// Alter the address of the config endpoint named "PLC2" and reconnect (affects all nodes using it)
msg.action = "connect";
msg.endpoint = { target: "config", address: "10.0.0.5", force: true };</pre>
</script>
