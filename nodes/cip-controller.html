<script type="text/javascript">
  RED.nodes.registerType("cip-controller", {
    category: "CIP Suite",
    color: "#999999",
    defaults: {
      name: { value: "" },
      endpoint: { value: "", type: "cip-endpoint", required: true },
      pollInterval: { value: 0 }
    },
    inputs: 1,
    outputs: 1,
    icon: "cip.svg",
    paletteLabel: "cip controller",
    label: function () {
      return this.name || "controller";
    }
  });
</script>

<script type="text/html" data-template-name="cip-controller">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-endpoint"><i class="fa fa-server"></i> Endpoint</label>
    <input type="text" id="node-input-endpoint" />
  </div>
  <div class="form-row">
    <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> Poll (ms)</label>
    <input type="number" id="node-input-pollInterval" placeholder="0 = trigger only" />
  </div>
</script>

<script type="text/html" data-help-name="cip-controller">
  <p>Reads controller properties and status from an Allen-Bradley PLC via EtherNet/IP (CIP).</p>
  <h3>Inputs</h3>
  <p>Any incoming message triggers a controller info read.</p>
  <dl class="message-properties">
    <dt>command <span class="property-type">string</span></dt>
    <dd>Optional: <code>"getProps"</code> or <code>"getStatus"</code>. Both do the same read
    as any other message.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.name <span class="property-type">string</span></dt>
    <dd>Product name from the Identity object, for example <code>2080-L50E-24QBB</code>.</dd>
    <dt>payload.serial <span class="property-type">string</span></dt>
    <dd>Controller serial number.</dd>
    <dt>payload.firmware <span class="property-type">object</span></dt>
    <dd>Firmware revision as <code>{ major, minor }</code>.</dd>
    <dt>payload.vendorId, deviceType, productCode <span class="property-type">number</span></dt>
    <dd>Identity numbers of the device.</dd>
    <dt>payload.status <span class="property-type">object</span></dt>
    <dd><code>runMode</code>, <code>faulted</code>, <code>majorFault</code>, <code>minorFault</code>
    and <code>ioFault</code>, decoded from the Identity status word, read fresh each time.
    <code>runMode</code> is <code>"run"</code>, <code>"program"</code> or <code>"unknown"</code>.
    A Micro800's status word is the same in Run and Program, so its mode comes from the
    Identity State attribute instead.</dd>
    <dt>payload.keyswitch <span class="property-type">string</span></dt>
    <dd><code>"run"</code>, <code>"program"</code>, <code>"remote"</code> or <code>"unknown"</code>.
    Only Logix controllers report it; a Micro800 reads as <code>"unknown"</code>.</dd>
    <dt>payload.tagCount <span class="property-type">number</span></dt>
    <dd>Number of tags in the controller tag list.</dd>
    <dt>payload.time <span class="property-type">Date</span></dt>
    <dd>Controller wall clock, if the controller supports it.</dd>
    <dt>timestamp <span class="property-type">number</span></dt>
    <dd>Unix timestamp (ms) of the read.</dd>
  </dl>
  <h3>Details</h3>
  <p>Set a <b>Poll</b> interval (in milliseconds) for periodic status reads, or leave at 0 for
  trigger-only mode. This is useful for monitoring PLC health and run state.</p>
  <h3>Commands</h3>
  <p><code>msg.command</code> accepts <code>"getProps"</code> and <code>"getStatus"</code>, which both
  read the controller as above.</p>
  <p>The node does not change the controller mode or reset faults. <code>"run"</code>,
  <code>"program"</code>, <code>"test"</code> and <code>"reset"</code> fail with an error: Logix
  has no documented CIP request for a mode change, and the only CIP reset restarts the
  device. Use the keyswitch or Studio 5000.</p>
  <h3>Metrics</h3>
  <p>The node tracks connection uptime, request count, and error count in the node status.
  Use this node alongside dashboard nodes to build PLC health monitoring views.</p>

  <h3>Dynamic control</h3>
  <p>The PLC connection can be selected, re-pointed and controlled at runtime with
  <code>msg.endpoint</code> and <code>msg.action</code> when the endpoint has the
  <b>Dynamic</b> option enabled. See the <code>cip-endpoint</code> help for the
  full reference.</p>
</script>
